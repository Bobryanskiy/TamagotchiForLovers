name: Android CD

on:
  push:
    tags:
      - 'v*'  # Триггер на теги вида v1.0.0, v1.2.3-beta

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════
  # 1. Build signed APK + AAB
  # ═══════════════════════════════════════════════════════
  build-release:
    name: 🚀 Build Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # для создания GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK & AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v5
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v5
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # ═══════════════════════════════════════════════════════
      # 2. GitHub Release (автоматически)
      # ═══════════════════════════════════════════════════════
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tamagotchi for Lovers ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}